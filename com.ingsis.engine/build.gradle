plugins {
    id 'java'
    id 'application'
}

application {
    mainClass = 'engine.CliEngine'
}

run {
    standardInput = System.in
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':com.ingsis.common')
    implementation project(':com.ingsis.charstream')
    implementation project(':com.ingsis.lexer')
    implementation project(':com.ingsis.parser')
    implementation project(':com.ingsis.interpreter')
    implementation 'info.picocli:picocli:4.7.5'

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}