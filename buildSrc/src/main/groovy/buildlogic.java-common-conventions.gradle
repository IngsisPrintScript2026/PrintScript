plugins {
    id 'checkstyle'
    id 'com.diffplug.spotless'
    id 'com.github.spotbugs'
    id 'java'
    id 'jacoco'
    id 'pmd'
    id 'publishing-convention'
}

repositories {
    mavenCentral()
}

dependencies {
    constraints {
        implementation 'org.apache.commons:commons-text:1.11.0'
    }

    implementation "com.github.spotbugs:spotbugs-annotations:4.8.6"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test, classes
    finalizedBy jacocoTestCoverageVerification

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, excludes: [
                    '**/generated/**',
                    '**/config/**',
                    '**/*Application*',
                    '**/*Test*',
                    '**/*$*'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }
        rule {
            element = 'CLASS'
            excludes = ['*.Main', '*.config.*']
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.spotlessCheck
    dependsOn tasks.spotbugsMain
    dependsOn tasks.checkstyleMain
    dependsOn tasks.pmdMain
    dependsOn tasks.jacocoTestCoverageVerification
}

tasks.named('build') {
    dependsOn tasks.spotlessApply
}

checkstyle {
    configFile = file("${project.rootDir}/.checkstyle.xml")
    toolVersion = '10.15.0'
    ignoreFailures = true
    maxWarnings = 0
    configProperties = [
            'org.checkstyle.java.jdkversion': '17',
            'suppressionFile': "${project.rootDir}/config/checkstyle/suppressions.xml"
    ]
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.22.0').aosp().reflowLongStrings()
        removeUnusedImports()
        importOrder()
        licenseHeader '/*\n * My Project\n */\n\n'
        endWithNewline()
    }
    format 'misc', {
        target '*.md', '.gitignore'
        trimTrailingWhitespace()
        indentWithSpaces(2)
        endWithNewline()
    }
}

pmd {
    ignoreFailures = true
}

spotbugs {
    toolVersion = '4.8.3'
    ignoreFailures = true
    effort.set(com.github.spotbugs.snom.Effort.valueOf('MAX'))
    reportLevel.set(com.github.spotbugs.snom.Confidence.valueOf('LOW'))
}

tasks.withType(Checkstyle).configureEach { task ->
    reports {
        xml.required.set(false)
        html.required.set(true)
        html.outputLocation.set(layout.buildDirectory.file("custom-reports/checkstyle/${task.name}.html"))
    }
}

tasks.withType(Pmd).configureEach { task ->
    reports {
        xml.required.set(false)
        html.required.set(true)
        html.outputLocation.set(layout.buildDirectory.file("custom-reports/pmd/${task.name}.html"))
    }
}
tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach { task ->
    reports {
        html.required.set(true)
        html.outputLocation.set(layout.buildDirectory.file("custom-reports/spotbugs/${task.name}.html"))
        xml.required.set(false)
    }
    def eiFilter = file("${project.rootDir}/config/spotbugs/exclude-ei.xml")
    def mainFilter = file("${project.rootDir}/config/spotbugs/exclude.xml")
    if (eiFilter.exists()) {
        excludeFilter.set(eiFilter)
    } else if (mainFilter.exists()) {
        excludeFilter.set(mainFilter)
    }
    task.ignoreFailures = true
}

jacocoTestReport {
    reports {
        xml.required.set(true)
        xml.outputLocation.set(layout.buildDirectory.file("custom-reports/jacoco/jacoco.xml"))
        html.required.set(true)
        html.outputLocation.set(layout.buildDirectory.dir("custom-reports/jacoco/html"))
        csv.required.set(false)
    }
}
