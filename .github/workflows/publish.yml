name: Publish

# Publica PrintScript en GitHub Packages solo cuando se publica un release,
# nunca en cada push. La versión del artefacto sale del tag del release
# (v1.3.0 -> 1.3.0), así cada versión publicada es inmutable.
on:
  release:
    types: [ published ]

jobs:
  ci:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check (format, linters, tests, coverage)
        run: ./gradlew check

  publish:
    name: Publish to GitHub Packages
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # sin esto, el publish falla con 403

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve version from release tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::El tag '$TAG' no es una versión válida (ej: v1.3.0)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish package
        run: ./gradlew publish -Pversion=${{ steps.version.outputs.version }}
        env: # las credenciales entran por el ambiente
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
