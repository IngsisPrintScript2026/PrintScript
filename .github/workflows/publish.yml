name: CI & Publish Packages

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. CI JOB: Formatter, Linter & Tests
  # ==========================================
  ci:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Code Formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Run Linters & Static Analysis (Checkstyle, PMD, SpotBugs)
        run: ./gradlew check -x test

      - name: Run Tests
        run: ./gradlew test

  # ==========================================
  # 2. CD JOB: Publish to GitHub Packages
  # ==========================================
  publish:
    name: Publish Packages to GitHub Packages
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish to GitHub Packages
        run: ./gradlew publish -PgprUser=${{ github.actor }} -PgprToken=${{ secrets.GITHUB_TOKEN }}
        env:
          gprUser: ${{ github.actor }}
          gprToken: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_gprUser: ${{ github.actor }}
          ORG_GRADLE_PROJECT_gprToken: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
