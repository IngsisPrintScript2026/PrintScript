name: CI Pipeline

on:
  push:
    branches: [ main, master, dev, develop ]
  pull_request:
    branches: [ main, master, dev, develop ]
  workflow_dispatch:

jobs:
  ci:
    name: Lint, Format, Build & Coverage (> 80%)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Code Formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Run Linters & Static Code Analysis (Checkstyle, PMD, SpotBugs)
        run: ./gradlew checkstyleMain checkstyleTest pmdMain pmdTest spotbugsMain spotbugsTest

      - name: Build Project
        run: ./gradlew assemble

      - name: Run Tests & JaCoCo Coverage Report
        run: ./gradlew test jacocoTestReport

      - name: Verify Code Coverage (> 80%)
        run: ./gradlew jacocoTestCoverageVerification

      - name: Upload Test & Quality Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/custom-reports/
