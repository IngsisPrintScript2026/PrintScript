plugins {
    id 'java'
}

allprojects {
    group = 'org.example'
    version = project.findProperty('version') ?: System.getenv('RELEASE_VERSION') ?: '1.0.0'
}

subprojects {
    group = 'org.example'
    version = rootProject.version
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.register('installGitHooks', Exec) {
    description = 'Configura los githooks versionados del repositorio'
    group = 'git'
    commandLine 'git', 'config', 'core.hooksPath', '.githooks'
    doLast {
        println 'Githooks instalados correctamente (core.hooksPath configurado a .githooks)'
    }
}